name: 功能或兼容性问题
description: 报告可复现的故障、误报或运行差异。
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: Git commit、Unity 版本、平台、Mono / IL2CPP、相关包版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 使用自有样本；附脱敏日志，不附凭证或真实用户数据。
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: 原始构建对照与影响范围
