name: 方案与功能建议
description: 提出保护能力、接入或兼容范围的改进。
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明对应核心能力、用户场景与现有不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与替代方案
      description: 说明如何保持只引入插件、原 Build、功能和资源无损。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 如何证明有效
      description: 对照、失败条件、兼容性与性能验证。
    validations:
      required: true
